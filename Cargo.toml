[workspace]
resolver = "3"
members = [
    "crates/stashee-core",
    "crates/stashee-pty",
    "crates/stashee-voice",
    "crates/stashee",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
# The oldest Rust in a distro we build packages for (Fedora 43 and 45 are
# on 1.97; 44 has moved to 1.98). Keeps cargo's resolver off crates that
# need a newer compiler than those builders have, and turns "too old to
# build" into one clear line instead of an error deep in a build.
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
fastrand = "2"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
