# Runs in Forgejo, where the pull requests are: a repository with
# .forgejo/workflows/ makes Forgejo ignore .github/workflows entirely, so the
# copy on GitHub cannot cover these. Same gate as .github/workflows/ci.yml.
name: ci

on:
  pull_request

# A newer push to the same branch makes the running check pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: docker
    # Built from .forgejo/ci-image/Containerfile — the toolchain and the GTK
    # headers used to be installed by dnf on every single run.
    container:
      image: local/stashee-ci:latest
      # A named volume rather than actions/cache: on one self-hosted runner the
      # registry and the build directory can simply stay on disk between runs,
      # with no archive to pack, upload and unpack every time.
      volumes:
        - ci-cargo:/cargo
    env:
      CARGO_HOME: /cargo/home
      CARGO_TARGET_DIR: /cargo/target
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
