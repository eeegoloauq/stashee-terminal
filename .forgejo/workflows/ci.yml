# Runs in Forgejo, where the pull requests are: a repository with
# .forgejo/workflows/ makes Forgejo ignore .github/workflows entirely, so the
# copy on GitHub cannot cover these. Same gate as .github/workflows/ci.yml.
name: ci

on:
  pull_request

# A newer push to the same branch makes the running check pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: docker
    # Built from .forgejo/ci-image/Containerfile — the toolchain and the GTK
    # headers used to be installed by dnf on every single run.
    container: local/stashee-ci:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
